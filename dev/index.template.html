<script>
  // Bloqueo de doble-tap-zoom y pull-to-refresh (además de touch-action/overscroll-behavior en CSS).
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>
