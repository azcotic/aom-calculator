<div class="flex justify-between items-center text-[10px] font-label-md">

</div>

</button>

</button>

<!-- Core Titan Score Section -->

<div class="flex flex-col">
<div class="flex items-baseline gap-2">
<span class="font-display-titan-mobile text-display-titan-mobile text-primary font-bold tracking-tight drop-shadow-[0_0_20px_rgba(235,193,102,0.3)]" id="p1-base-score" style="font-size: 104px; line-height: 0.9;">9</span>

<span class="font-label-md text-label-md text-xs">Puntaje previsto:</span>

<span class="material-symbols-outlined text-[28px] opacity-40">casino</span>
</div>

<span class="material-symbols-outlined text-[28px] opacity-40">casino</span>
</div>

</div>

<script>
  let state = {
    p1: { base: 9, wall: false, mod: 0 },
    p2: { base: 5, wall: false, mod: 0 },
    mode: 'digital'
  };

  function updateDisplay(player) {
    const data = state[player];
    const total = data.base + (data.wall ? 2 : 0) + data.mod;
    const projEl = document.getElementById(player + '-projected');
    const modEl = document.getElementById(player + '-mod-val');
    const wallBtn = document.getElementById(player + '-wall-btn');

    if (projEl) projEl.innerText = total;
    if (modEl) modEl.innerText = (data.mod >= 0 ? '+' : '') + data.mod;

    if (wallBtn) {
      if (data.wall) {
        wallBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        if (player === 'p1') {
          wallBtn.classList.add('bg-primary', 'text-on-primary');
        } else {
          wallBtn.classList.add('bg-secondary', 'text-on-secondary');
        }
      } else {
        wallBtn.classList.remove('bg-primary', 'text-on-primary', 'bg-secondary', 'text-on-secondary');
        wallBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
      }
    }
  }

  function toggleWall(player) {
    state[player].wall = !state[player].wall;
    updateDisplay(player);
  }

  function adjustMod(player, delta) {
    state[player].mod = Math.max(-5, Math.min(10, state[player].mod + delta));
    updateDisplay(player);
  }

  function setDiceMode(mode) {
    state.mode = mode;
    const digBtn = document.getElementById('mode-digital');
    const phyBtn = document.getElementById('mode-physical');
    if (mode === 'digital') {
      digBtn.className = 'px-3 py-1 rounded-full text-[11px] font-label-md font-semibold transition-all bg-primary text-on-primary shadow-sm';
      phyBtn.className = 'px-3 py-1 rounded-full text-[11px] font-label-md text-on-surface-variant transition-all hover:text-on-surface';
    } else {
      phyBtn.className = 'px-3 py-1 rounded-full text-[11px] font-label-md font-semibold transition-all bg-primary text-on-primary shadow-sm';
      digBtn.className = 'px-3 py-1 rounded-full text-[11px] font-label-md text-on-surface-variant transition-all hover:text-on-surface';
    }
  }

  function triggerClash() {
    const trigger = document.getElementById('roll-trigger');
    trigger.classList.add('scale-95', 'brightness-125');
    setTimeout(() => trigger.classList.remove('scale-95', 'brightness-125'), 180);

    const rollDie = () => Math.floor(Math.random() * 6) + 1;
    
    // Animate slot placeholders
    ['p1-die-1', 'p1-die-2', 'p2-die-1', 'p2-die-2'].forEach((id, idx) => {
      const el = document.getElementById(id);
      el.classList.add('animate-pulse');
      setTimeout(() => {
        el.classList.remove('animate-pulse');
        const val = rollDie();
        el.innerHTML = `<span class="font-numeral-counter text-numeral-counter text-on-surface font-bold">${val}</span>`;
        if (id.startsWith('p1')) {
          el.classList.add('bg-primary/20', 'text-primary');
        } else {
          el.classList.add('bg-secondary/20', 'text-secondary');
        }
      }, 250 + (idx * 90));
    });
  }
</script></main>
